<header class="site-header">
  <div class="topbar">
    <div class="container topbar__inner">
      <span class="topbar__gov">Governo Federal · Ministério da Educação</span>
      <a class="topbar__link" href="#">Acesso à Informação</a>
    </div>
  </div>

  <div class="container header__inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Página inicial da UNIPAMPA">
      <img src="{{ '/assets/img/logo-unipampa.png' | relative_url }}"
           alt="UNIPAMPA — Universidade Federal do Pampa" width="403" height="86">
    </a>

    <form class="search" role="search" action="#" onsubmit="return false">
      <label class="sr-only" for="busca">Buscar no site</label>
      <input id="busca" class="search__input" type="search" placeholder="Buscar...">
      <button class="search__btn" type="submit" aria-label="Buscar">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5 1.5-1.5-5-5Zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14Z"/>
        </svg>
      </button>
    </form>

    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle__label" aria-label="Abrir menu">
      <span></span><span></span><span></span>
    </label>

    <nav class="nav" aria-label="Menu principal">
      <ul class="nav__list">
        {% for item in site.data.navigation %}
        {% assign cur = page.url | default: "/" %}
        <li class="nav__item">
          <a class="nav__link{% if item.url != '#' and cur contains item.url and item.url != '/' %} is-active{% endif %}"
             href="{% if item.url == '#' %}#{% else %}{{ item.url | relative_url }}{% endif %}">
            {{ item.title }}
          </a>
        </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
